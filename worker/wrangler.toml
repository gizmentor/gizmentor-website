# Cloudflare Worker behind the website's forms (Contact and the website-design brief).
# Deployed by .github/workflows/deploy-forms.yml; setup steps are in worker/README.md.
name = "gizmentor-forms"
main = "src/index.js"
compatibility_date = "2026-10-01"
workers_dev = false

# forms.gizmentor.com: Cloudflare creates the DNS record itself (the zone is on Cloudflare).
routes = [{ pattern = "forms.gizmentor.com", custom_domain = true }]

[vars]
ALLOWED_ORIGINS = "https://gizmentor.com,https://www.gizmentor.com"
# Must be on the domain verified in Resend.
MAIL_FROM = "GizMentor <forms@send.gizmentor.com>"
LEADS_TO = "info@gizmentor.com"
# Partner, merchant and affiliate enquiries (site.js partnersEmail).
PARTNERS_TO = "partners@easelect.ai"

[observability]
enabled = true
