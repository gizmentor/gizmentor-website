# Installed as /etc/nginx/snippets/gizmentor-headers.conf and included in gizmentor.com's
# server block by deploy/nginx/install.sh. Same headers as vercel.json, plus Cache-Control
# from conf.d/gizmentor-cache.conf. An empty value sends no header.
# Note: nginx drops these inside any location block that has add_header lines of its own.
add_header Cache-Control $gizmentor_cache_control always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "SAMEORIGIN" always;
