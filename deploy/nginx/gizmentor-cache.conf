# Installed as /etc/nginx/conf.d/gizmentor-cache.conf (http context) by deploy/nginx/install.sh.
# Chooses the Cache-Control header for gizmentor.com responses:
#   /assets/*   file names change with every build, so browsers keep them for a year
#   HTML pages  browsers must check for a newer copy on every visit (no-cache still lets
#               them reuse their copy when the server says it has not changed, via ETag)
#   the rest    nginx's default (no header)
map $sent_http_content_type $gizmentor_html_cache {
    ~^text/html  "no-cache";
    default      "";
}

map $uri $gizmentor_cache_control {
    ~^/assets/   "public, max-age=31536000, immutable";
    default      $gizmentor_html_cache;
}
