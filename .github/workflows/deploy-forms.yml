# Deploys the forms Worker (worker/, served at forms.gizmentor.com) when a merge to main changes it,
# and copies its secrets from the production environment into Cloudflare. Run again by hand:
# GitHub app → Actions → Deploy forms → Run workflow. Setup: worker/README.md.
name: Deploy forms

on:
  push:
    branches: [main]
    paths: ['worker/**', '.github/workflows/deploy-forms.yml']
  workflow_dispatch:

concurrency:
  group: deploy-forms
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      WRANGLER: wrangler@4.153.0
    steps:
      - name: Is Cloudflare set up?
        id: setup
        env:
          HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
          HAS_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
        run: |
          missing=""
          [ "$HAS_TOKEN" = "true" ] || missing="$missing CLOUDFLARE_API_TOKEN"
          [ "$HAS_ACCOUNT" = "true" ] || missing="$missing CLOUDFLARE_ACCOUNT_ID"
          if [ -z "$missing" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          elif [ "$GITHUB_EVENT_NAME" = "push" ]; then
            echo "::warning::Forms Worker not deployed: the production environment still needs:$missing (worker/README.md)."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Set$missing for the production environment (worker/README.md)."
            exit 1
          fi

      - uses: actions/checkout@v4
        if: steps.setup.outputs.ready == 'true'

      - uses: actions/setup-node@v4
        if: steps.setup.outputs.ready == 'true'
        with:
          node-version: 22

      - name: Deploy the Worker
        if: steps.setup.outputs.ready == 'true'
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes "$WRANGLER" deploy

      # Secrets go from GitHub to Cloudflare over stdin; they are never printed or written to disk.
      - name: Copy secrets to the Worker
        if: steps.setup.outputs.ready == 'true'
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
        run: |
          for name in RESEND_API_KEY TURNSTILE_SECRET_KEY; do
            if [ -n "${!name}" ]; then
              printf '%s' "${!name}" | npx --yes "$WRANGLER" secret put "$name" > /dev/null
              echo "$name set"
            else
              echo "::warning::$name is not set in the production environment; the forms need it (worker/README.md)."
            fi
          done

      - name: Check the Worker answers
        if: steps.setup.outputs.ready == 'true'
        run: |
          for i in 1 2 3 4 5 6; do
            code=$(curl -s -o /dev/null -w '%{http_code}' -X OPTIONS -H 'Origin: https://gizmentor.com' https://forms.gizmentor.com/ || true)
            [ "$code" = "204" ] && { echo "forms.gizmentor.com answers"; exit 0; }
            sleep 10
          done
          echo "::error::forms.gizmentor.com did not answer (last status $code)."
          exit 1
